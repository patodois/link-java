plugins {
	id 'java-library'
	id 'maven-publish'
}

// Pure Java, no dependencies. Release 8 so the jar loads on every runtime a game embeds it in:
// Minecraft 1.7.10 and 1.12.2 (Java 8), 1.20.1 (Java 17), 26.x (Java 21 and up). `release` (javac
// --release), not just source/target, compiles against the Java 8 class library, so a call to
// anything newer (List.of, String.repeat, the absolute bulk ByteBuffer methods, VarHandle...) is a
// compile error here instead of a NoSuchMethodError in someone's game. Needs JDK 9 or newer to
// build; JDK 25 still supports --release 8, with an "obsolete" lint warning that is switched off.
tasks.withType(JavaCompile).configureEach {
	options.release = 8
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xlint:all' << '-Xlint:-options'
}

java {
	withSourcesJar()
}

jar {
	archiveBaseName = 'link-java'
	manifest {
		attributes 'Implementation-Title': 'link-java', 'Implementation-Version': project.version
	}
	from('LICENSE-MIT') { rename { "${it}_link-java" } }
	from('LICENSE-APACHE') { rename { "${it}_link-java" } }
}

// The tests are a plain runner with a main method (no JUnit, no dependencies): they encode and
// decode the contract's worked example, check every layout offset, fuzz the decoder and run live
// sessions on loopback. The runner exits non-zero if anything fails, which fails the build.
tasks.register('linkTests', JavaExec) {
	group = 'verification'
	description = 'Runs dev.patodois.rewritelink.LinkTests'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.patodois.rewritelink.LinkTests'
	maxHeapSize = '256m'
}
// The same tests in a JVM that prefers IPv6, as the NeoForge and Forge launchers start the game:
// the link must still bind and connect to 127.0.0.1, not ::1
tasks.register('linkTestsPreferIpv6', JavaExec) {
	group = 'verification'
	description = 'Runs LinkTests with -Djava.net.preferIPv6Addresses=system'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.patodois.rewritelink.LinkTests'
	maxHeapSize = '256m'
	jvmArgs '-Djava.net.preferIPv6Addresses=system'
}
tasks.named('test') { enabled = false } // there is no JUnit; linkTests replaces it
tasks.named('check') { dependsOn 'linkTests', 'linkTestsPreferIpv6' }

// `./gradlew demo --args="guest --port 47800 --orbit"` runs the command-line peer.
tasks.register('demo', JavaExec) {
	group = 'application'
	description = 'Runs LinkDemo (a stand-in host or guest, mirrors the Rust fake_host / fake_guest)'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.patodois.rewritelink.LinkDemo'
	maxHeapSize = '128m'
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
