name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      # Runs the tests twice: normally and in a JVM that prefers IPv6
      - run: ./gradlew --no-daemon check

  # Game files, decompiled or third-party code and secrets must never reach this public repository: this runs
  # tools/check_public_tree.py on the commits of the push or pull request (a new branch: all of its history).
  public-tree:
    name: Public tree (no game files, decompiled code or secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the commits of this push or pull request
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 tools/check_public_tree.py --range "$BASE..$HEAD"
          else
            python3 tools/check_public_tree.py --range "$HEAD"
          fi

  python-tests:
    name: Gate and workflow regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install workflow test dependencies
        run: |
          python3 -m venv .workflow-tests
          .workflow-tests/bin/python -m pip install -r tools/requirements-test.txt
      - run: .workflow-tests/bin/python -m unittest discover -s tools -p 'test_*.py'
